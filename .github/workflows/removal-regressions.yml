name: Removal regressions

on:
  pull_request:
    paths:
      - "crates/disktree-core/**"
      - "crates/disktree-app/src/marks.rs"
      - "crates/disktree-app/src/state.rs"
      - ".github/workflows/removal-regressions.yml"

permissions:
  contents: read

concurrency:
  group: removal-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows-') && '-C target-feature=+crt-static -C control-flow-guard=yes' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # recorded 2026-10-08
        with:
          toolchain: "1.97"
          components: clippy
      # Fast feedback on filesystem guards while the full UI gate builds.
      - name: Core lint
        run: >-
          cargo clippy --locked -p disktree-core --all-targets
          --all-features -- -D warnings
      - name: Core tests
        run: cargo test --locked -p disktree-core
