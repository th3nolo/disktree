name: Formal removal model

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'crates/disktree-core/src/removal*.rs'
      - 'crates/disktree-core/src/windows*.rs'
      - 'crates/disktree-app/src/state.rs'
      - '.github/workflows/formal-removal.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'crates/disktree-core/src/removal*.rs'
      - 'crates/disktree-core/src/windows*.rs'
      - 'crates/disktree-app/src/state.rs'
      - '.github/workflows/formal-removal.yml'

permissions:
  contents: read

concurrency:
  group: formal-removal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean kernel and shared fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No third-party proof packages. Verify the official toolchain archive
      # before extraction; the version must agree with lean-toolchain.
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat formal/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
          echo '47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  '"$RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/disktree-lean"
          tar --zstd --extract --file "$RUNNER_TEMP/lean.tar.zst" \
            --directory "$RUNNER_TEMP/disktree-lean" --strip-components=1
          echo "$RUNNER_TEMP/disktree-lean/bin" >> "$GITHUB_PATH"

      - name: Kernel check and audit
        working-directory: formal/lean
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee lean-version.txt
          git rev-parse HEAD > checked-commit.txt
          lake build
          LEAN_AUDIT_INTEGRATION=1 python3 -m unittest -v test_audit.py test_mutation_classifier.py 2>&1 | tee auditor-tests.log
          python3 audit.py proof-audit.json | tee proof-audit.log
          lake exe checkFixtures | tee fixture-results.log

      - name: Reject weakened specifications
        working-directory: formal/lean
        shell: bash
        run: |
          set -euo pipefail
          python3 test_mutations.py | tee mutation-tests.log

      - name: Retain formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-removal-evidence
          path: |
            formal/lean/lean-version.txt
            formal/lean/checked-commit.txt
            formal/lean/proof-audit.log
            formal/lean/proof-audit.json
            formal/lean/auditor-tests.log
            formal/lean/fixture-results.log
            formal/lean/mutation-tests.log
            formal/lean/mutation-results.json
          if-no-files-found: error
          retention-days: 14
