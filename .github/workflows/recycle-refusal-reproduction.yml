name: Recycling refusal reproduction

on:
  push:
    branches: ["hardening/windows-recycling-refusal"]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    env:
      RUSTFLAGS: -C target-feature=+crt-static -C control-flow-guard=yes
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # recorded 2026-10-08
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: recycling-refusal-core
      - name: Reproduce replacement at the shell handoff
        run: >-
          cargo test --locked -p disktree-core
          removal::tests::recycling_refuses_replacement_after_the_final_identity_check
          -- --exact --nocapture
